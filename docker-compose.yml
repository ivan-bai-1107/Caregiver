services:
  postgres:
    image: postgres:16
    container_name: caregiver_postgres
    environment:
      POSTGRES_USER: caregiver
      POSTGRES_PASSWORD: caregiver123
      POSTGRES_DB: caregiver_system
    ports:
      - "5432:5432"
    volumes:
      - caregiver_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregiver -d caregiver_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caregiver_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - caregiver_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caregiver_postgres_data:
  caregiver_redis_data:
